<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a80d4">
    <title>家計簿</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <header class="app-header">
      <h1>家計簿</h1>
    </header>

    <main class="app-main">

      <section id="tab-home" class="tab-panel" hidden aria-labelledby="home-heading">
        <h2 id="home-heading">ホーム</h2>

        <div class="home-summary">
          <div class="summary-card">
            <span class="summary-card-label">今日の支出</span>
            <span class="summary-card-value" id="home-today-expense">0円</span>
          </div>
          <div class="summary-card">
            <span class="summary-card-label">今月の支出</span>
            <span class="summary-card-value" id="home-month-expense">0円</span>
          </div>
        </div>

        <button type="button" class="btn-primary" id="home-add-button">記録を追加する</button>
      </section>

      <section id="tab-form" class="tab-panel" aria-labelledby="form-heading">
        <h2 id="form-heading">記録を入力する</h2>

        <form id="record-form" novalidate>

          <fieldset>
            <legend>収支区分</legend>
            <div class="radio-group">
              <label>
                <input type="radio" name="type" value="expense" checked />
                支出
              </label>
              <label>
                <input type="radio" name="type" value="income" />
                収入
              </label>
            </div>
            <p class="field-error" id="error-type" aria-live="polite"></p>
          </fieldset>

          <div class="form-field">
            <label for="amount">金額（円）</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="1"
              step="1"
              placeholder="例：1200"
            />
            <p class="field-error" id="error-amount" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="category">カテゴリ</label>
            <select id="category" name="category">
              <option value="" disabled selected>選択してください</option>
            </select>
            <p class="field-error" id="error-category" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="date">記録日</label>
            <input type="date" id="date" name="date" />
            <p class="field-error" id="error-date" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="memo">メモ（任意）</label>
            <input
              type="text"
              id="memo"
              name="memo"
              placeholder="例：昼食"
            />
            <p class="field-error" id="error-memo" aria-live="polite"></p>
          </div>

          <p
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit" class="btn-primary">記録する</button>

        </form>
      </section>

      <section id="tab-history" class="tab-panel" hidden aria-labelledby="history-heading">
        <h2 id="history-heading">履歴</h2>

        <p
          id="history-status"
          class="form-status"
          role="status"
          aria-live="polite"
        ></p>

        <ul id="history-list" class="history-list"></ul>
      </section>

      <section id="tab-summary" class="tab-panel" hidden aria-labelledby="summary-heading">
        <h2 id="summary-heading">集計</h2>

        <div class="month-selector">
          <button type="button" class="month-nav-button" id="prev-month-button" aria-label="前月へ">‹ 前月</button>
          <div class="month-selector-current">
            <label for="summary-month" class="visually-hidden">対象月</label>
            <input type="month" id="summary-month" class="month-input" />
          </div>
          <button type="button" class="month-nav-button" id="next-month-button" aria-label="翌月へ">翌月 ›</button>
        </div>

        <div class="summary-totals">
          <div class="summary-card">
            <span class="summary-card-label">収入合計</span>
            <span class="summary-card-value" id="summary-income">0円</span>
          </div>
          <div class="summary-card">
            <span class="summary-card-label">支出合計</span>
            <span class="summary-card-value" id="summary-expense">0円</span>
          </div>
          <div class="summary-card">
            <span class="summary-card-label">収支</span>
            <span class="summary-card-value" id="summary-balance">0円</span>
          </div>
        </div>

        <h3 class="summary-subheading">カテゴリ別支出</h3>
        <ul id="summary-category-list" class="summary-category-list"></ul>
      </section>

    </main>

    <!-- ナビゲーション：スマホでは下部固定タブバー、PCでは上部タブ（CSSで制御） -->
    <nav class="tab-nav" aria-label="画面切替">
      <button type="button" class="tab-button" data-tab="home" aria-current="false">ホーム</button>
      <button type="button" class="tab-button" data-tab="form" aria-current="true">記録入力</button>
      <button type="button" class="tab-button" data-tab="history" aria-current="false">履歴</button>
      <button type="button" class="tab-button" data-tab="summary" aria-current="false">集計</button>
    </nav>

    <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-dialog-title">
      <form method="dialog" class="confirm-dialog-body">
        <h2 id="delete-dialog-title" class="confirm-dialog-title">記録の削除</h2>
        <p class="confirm-dialog-message">この記録を削除しますか？</p>
        <p id="delete-target-info" class="confirm-dialog-target"></p>
        <p class="confirm-dialog-note">削除した記録は元に戻せません。</p>

        <div class="confirm-dialog-actions">
          <button type="submit" value="cancel" class="btn-secondary">キャンセル</button>
          <button type="submit" value="confirm" class="btn-danger" id="confirm-delete-button">削除する</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
