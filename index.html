<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家計簿</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>家計簿</h1>
    </header>

    <main class="app-main">

      <!-- 記録入力エリア -->
      <section class="section-form" aria-labelledby="form-heading">
        <h2 id="form-heading">記録を入力する</h2>

        <form id="record-form" novalidate>

          <fieldset>
            <legend>収支区分</legend>
            <div class="radio-group">
              <label>
                <input
                  type="radio"
                  name="type"
                  value="expense"
                  checked
                />
                支出
              </label>
              <label>
                <input
                  type="radio"
                  name="type"
                  value="income"
                />
                収入
              </label>
            </div>
          </fieldset>

          <div class="form-field">
            <label for="amount">金額（円）</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="1"
              step="1"
              placeholder="例：1200"
            />
          </div>

          <div class="form-field">
            <label for="category">カテゴリ</label>
            <select id="category" name="category">
              <!-- 支出カテゴリ（初期表示） -->
              <option value="" disabled selected>選択してください</option>
              <option value="food">食費</option>
              <option value="daily">日用品</option>
              <option value="transport">交通費</option>
              <option value="leisure">趣味・娯楽</option>
              <option value="clothing">衣服</option>
              <option value="medical">医療</option>
              <option value="fixed">固定費</option>
              <option value="other_expense">その他</option>
            </select>
          </div>

          <div class="form-field">
            <label for="date">記録日</label>
            <input
              type="date"
              id="date"
              name="date"
            />
          </div>

          <div class="form-field">
            <label for="memo">メモ（任意）</label>
            <input
              type="text"
              id="memo"
              name="memo"
              placeholder="例：昼食"
            />
          </div>

          <!-- 状態メッセージ：スクリーンリーダーへも通知するため role="status" を使用 -->
          <p
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit" class="btn-primary">記録する</button>

        </form>
      </section>

      <!-- 履歴表示エリア（工程4で実装） -->
      <section class="section-history" aria-labelledby="history-heading">
        <h2 id="history-heading">履歴</h2>
        <p class="history-placeholder">（履歴はまだ実装されていません）</p>
      </section>

    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
