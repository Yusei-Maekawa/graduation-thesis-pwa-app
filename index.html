<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家計簿</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>家計簿</h1>
    </header>

    <main class="app-main">

      <section class="section-form" aria-labelledby="form-heading">
        <h2 id="form-heading">記録を入力する</h2>

        <form id="record-form" novalidate>

          <fieldset>
            <legend>収支区分</legend>
            <div class="radio-group">
              <label>
                <input type="radio" name="type" value="expense" checked />
                支出
              </label>
              <label>
                <input type="radio" name="type" value="income" />
                収入
              </label>
            </div>
            <p class="field-error" id="error-type" aria-live="polite"></p>
          </fieldset>

          <div class="form-field">
            <label for="amount">金額（円）</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="1"
              step="1"
              placeholder="例：1200"
            />
            <p class="field-error" id="error-amount" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="category">カテゴリ</label>
            <select id="category" name="category">
              <option value="" disabled selected>選択してください</option>
            </select>
            <p class="field-error" id="error-category" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="date">記録日</label>
            <input type="date" id="date" name="date" />
            <p class="field-error" id="error-date" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="memo">メモ（任意）</label>
            <input
              type="text"
              id="memo"
              name="memo"
              placeholder="例：昼食"
            />
            <p class="field-error" id="error-memo" aria-live="polite"></p>
          </div>

          <p
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit" class="btn-primary">記録する</button>

        </form>
      </section>

      <section class="section-history" aria-labelledby="history-heading">
        <h2 id="history-heading">履歴</h2>
        <p class="history-placeholder">（履歴はまだ実装されていません）</p>
      </section>

    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
